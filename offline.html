<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101A36">
  <title>MarketReady Tours — Offline</title>
  <style>
    /* Market Ready Brand Standards v5 (light). System font only — this page must render
       with no network, so it cannot depend on the DM Sans webfont. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F6F2; color: #111318; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { width: min(86vw, 420px); padding: 32px; border: 1px solid #E8E7E0; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 1px 2px rgb(16 26 54 / 4%), 0 12px 28px -20px rgb(16 26 54 / 16%); }
    .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #8A8D97; margin: 0 0 14px; }
    .eyebrow i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #2F44A0; margin-right: 8px; vertical-align: middle; }
    h1 { margin: 0 0 10px; color: #101A36; font-size: 25px; font-weight: 500; letter-spacing: -.02em; }
    p { margin: 0 0 20px; color: #5B5F6B; }
    button { border: 0; border-radius: 12px; padding: 13px 22px; background: #2F44A0; color: #fff; font: 600 15px/1 system-ui, -apple-system, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 2px solid #2F44A0; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow"><i></i>Market Ready Tours</p>
    <h1>You’re offline</h1>
    <p>Reconnect to load current tours or submit changes. Nothing has been reported as saved.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
