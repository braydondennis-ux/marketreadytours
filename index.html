<!-- Google Maps loads lazily — only injected when address search is first used -->
<script>
window._mapsLoaded=false;
window._mapsCallbacks=[];
window.loadGoogleMaps=function(cb){
  if(window.google&&window.google.maps){if(cb)cb();return;}
  if(cb)window._mapsCallbacks.push(cb);
  if(window._mapsLoading)return;
  window._mapsLoading=true;
  window._gmapsReady=function(){
    window._mapsLoaded=true;
    window._mapsCallbacks.forEach(function(fn){try{fn();}catch(e){}});
    window._mapsCallbacks=[];
  };
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key=AIzaSyBoPhoNQ5C84nS79QDV36R93APg4Pizo_E&libraries=places&callback=_gmapsReady';
  s.async=true;s.defer=true;
  document.head.appendChild(s);
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F4EF;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color:#1A1714;line-height:1.5}
button,select{font-family:'Hanken Grotesk',-apple-system,sans-serif}
/* Fraunces display headings (set via inline fontFamily) get tighter optical spacing */
h1,h2,h3,h4{letter-spacing:-.015em;line-height:1.12}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(201,165,90,.55);border-radius:3px}::-webkit-scrollbar-track{background:transparent}
textarea,input,select{font-family:inherit}
.btn-hover{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease,opacity .18s ease,background .18s ease!important}
.btn-hover:hover{transform:translateY(-1.5px);box-shadow:0 6px 18px rgba(27,58,107,.18)!important;opacity:.97}
.btn-hover:active{transform:translateY(0) scale(.99);box-shadow:none!important}
.card-hover{transition:all .25s cubic-bezier(.4,0,.2,1)}
.card-hover:hover{box-shadow:0 16px 48px rgba(0,0,0,.18)!important;transform:translateY(-3px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeIn .35s cubic-bezier(.4,0,.2,1)}
input:focus,textarea:focus,select:focus{outline:none;border-color:#C9A55A!important;box-shadow:0 0 0 3px rgba(201,165,90,.15)!important}
/* iOS safe-area: pads the page bottom away from the home indicator */
@supports(padding:env(safe-area-inset-bottom)){body{padding-bottom:env(safe-area-inset-bottom)}.mrt-scroll-pad{padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}}
/* ══ DESKTOP LAYER (>=1024px AND body.mrt-desktop only) ═══════════════════
   Everything here is double-gated: it cannot affect phones, portrait tablets,
   or the Capacitor iOS app (all < 1024px), and DESKTOP_MODE=false removes the
   body class so none of it applies at any width. ════════════════════════ */
/* Layout-transparent list wrapper: invisible to layout at base width (cards
   stay direct children of their original parent → mobile is identical). */
.mrt-list{display:contents}
@media (min-width:1024px){
  /* Shell: lifts the app-wide 480 cap so screens can use desktop width. */
  body.mrt-desktop .mrt-shell{ max-width:1200px !important; }
  body.mrt-desktop .mrt-col{
    max-width:720px !important;      /* widen the phone column on desktop */
    margin-left:auto !important; margin-right:auto !important;
  }
  /* generic grid behavior for any reflowed list; per-screen tasks tune columns */
  body.mrt-desktop .mrt-list{
    display:grid !important;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px !important;
    align-items:start;
  }
  body.mrt-desktop .mrt-dash-col{ max-width:1120px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-tours{ grid-template-columns:repeat(auto-fill,minmax(340px,1fr)) !important; gap:22px !important; }
  body.mrt-desktop .mrt-detail-col{ max-width:1000px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-listings{ grid-template-columns:repeat(auto-fill,minmax(360px,1fr)) !important; gap:20px !important; }
  body.mrt-desktop .mrt-summary-col{ max-width:960px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-summary{ grid-template-columns:repeat(auto-fill,minmax(400px,1fr)) !important; gap:18px !important; }
  body.mrt-desktop .mrt-admin-col{ max-width:1080px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-sponsors,
  body.mrt-desktop .mrt-list-team,
  body.mrt-desktop .mrt-list-requests{ grid-template-columns:repeat(auto-fill,minmax(380px,1fr)) !important; gap:18px !important; }
  body.mrt-desktop .mrt-list-sponsors{ grid-column:1 / -1 !important; }
}
/* ══ DESIGN TOKENS — Direction A "Quiet Luxury" (docs/design/design-tokens.css) ══ */
:root{
  --mrt-ink:#17130F;--mrt-ink-2:#241D16;--mrt-navy:#1B3A6B;--mrt-navy-2:#14294B;
  --mrt-gold:#C9A55A;--mrt-gold-deep:#9A7826;--mrt-gold-light:#E8D5A3;
  --mrt-cream:#F7F4EF;--mrt-paper:#FFFDFA;--mrt-muted:#6B6259;--mrt-muted-2:#8A8177;
  --mrt-hair:#EAE3D6;--mrt-hair-2:#E0D8C8;--mrt-red:#9B1C1C;
  --mrt-chip-navy-bg:#EEF3FA;--mrt-chip-navy-border:#CDD8E8;
  --mrt-success:#1F7A4D;--mrt-success-bg:#E6F2EA;--mrt-success-border:#BFE0CD;
  --mrt-gold-chip-bg:#FBF5E8;--mrt-neutral-chip-bg:#EFE9DD;
  --tour-navy:#1B3A6B;--tour-pine:#2E5748;--tour-clay:#9B5A41;--tour-plum:#63406B;--tour-teal:#2B5A5E;--tour-ochre:#8A6D22;
  --mrt-font-display:"Fraunces",Georgia,serif;--mrt-font-body:"Hanken Grotesk",system-ui,sans-serif;
  --mrt-radius-card:16px;--mrt-radius-modal:18px;--mrt-radius-btn:12px;--mrt-radius-btn-sm:10px;
  --mrt-radius-chip:8px;--mrt-radius-field:12px;--mrt-radius-pill:999px;
  --mrt-shadow-soft:0 1px 2px rgba(20,16,12,.03),0 14px 30px -18px rgba(20,16,12,.18);
  --mrt-shadow-pop:0 18px 36px -18px rgba(20,16,12,.34);
  --mrt-shadow-gold:0 10px 30px -14px rgba(154,120,38,.40);
  --mrt-ease:cubic-bezier(.2,.7,.3,1);--mrt-ease-pop:cubic-bezier(.2,.8,.3,1.4);--mrt-dur-press:.14s;
}
.mrt-eyebrow{font:600 11px/1 var(--mrt-font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--mrt-gold-deep);}
.mrt-card{background:var(--mrt-paper);border:1px solid var(--mrt-hair);border-radius:var(--mrt-radius-card);}
.mrt-card--soft{box-shadow:var(--mrt-shadow-soft);}
.mrt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--mrt-font-body);border-radius:var(--mrt-radius-btn);padding:14px 20px;border:1px solid transparent;cursor:pointer;}
.mrt-btn--sm{padding:10px 14px;font-size:13px;border-radius:var(--mrt-radius-btn-sm);}
.mrt-btn--navy{background:var(--mrt-navy);color:#fff;}
.mrt-btn--ink{background:var(--mrt-ink);color:#fff;}
.mrt-btn--ghost{background:transparent;color:var(--mrt-ink);border-color:var(--mrt-hair-2);}
.mrt-btn--gold{background:var(--mrt-gold);color:var(--mrt-ink-2);}
.mrt-pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mrt-font-body);padding:7px 10px;border-radius:var(--mrt-radius-pill);background:#fff;border:1px solid var(--mrt-hair);color:var(--mrt-ink);}
.mrt-chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mrt-font-body);color:var(--mrt-muted);padding:6px 9px;background:#FBF9F4;border:1px solid var(--mrt-hair);border-radius:var(--mrt-radius-chip);}
.mrt-field{border:1px solid var(--mrt-hair-2);border-radius:var(--mrt-radius-field);padding:12px 14px;font:500 14px/1.2 var(--mrt-font-body);color:var(--mrt-ink);background:var(--mrt-paper);width:100%;}
.mrt-field:focus{outline:none;border-color:var(--mrt-navy);box-shadow:0 0 0 3px rgba(27,58,107,.14);}
/* Segmented control (Team/Requests admin toggles) */
.mrt-seg{display:inline-flex;background:var(--mrt-neutral-chip-bg);border-radius:999px;padding:3px;gap:2px;}
.mrt-seg--block{display:flex;width:100%;}
.mrt-seg__btn{border:none;background:transparent;border-radius:999px;padding:9px 14px;font:700 12px/1 var(--mrt-font-body);color:var(--mrt-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .16s ease,color .16s ease;flex:1;white-space:nowrap;}
.mrt-seg__btn--active{background:var(--mrt-navy);color:#fff;box-shadow:0 2px 8px -2px rgba(20,16,12,.30);}
.mrt-seg__count{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.28);color:#fff;}
.mrt-seg__btn:not(.mrt-seg__btn--active) .mrt-seg__count{background:#fff;color:var(--mrt-muted);}
.mrt-seg--sm .mrt-seg__btn{padding:7px 10px;font-size:11px;}
/* Summary screen: 10 category bars in two columns on wider viewports, one on mobile */
.mrt-cat-grid{display:grid;grid-template-columns:1fr;gap:10px 24px;}
@media(min-width:480px){.mrt-cat-grid{grid-template-columns:1fr 1fr;}}
.tour-navy{--tc:var(--tour-navy);}.tour-pine{--tc:var(--tour-pine);}.tour-clay{--tc:var(--tour-clay);}
.tour-plum{--tc:var(--tour-plum);}.tour-teal{--tc:var(--tour-teal);}.tour-ochre{--tc:var(--tour-ochre);}
.tour-dot{width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block;}
.tour-spine{background:var(--tc);}
.mrt-press{transition:transform var(--mrt-dur-press) var(--mrt-ease),box-shadow var(--mrt-dur-press) ease;}
.mrt-press:hover{transform:translateY(-3px);box-shadow:var(--mrt-shadow-pop);}
.mrt-press:active{transform:translateY(-1px) scale(.99);box-shadow:0 8px 18px -12px rgba(20,16,12,.34);}
.mrt-live-dot{animation:mrt-live-pulse 1.8s ease-out infinite;}
@keyframes mrt-live-pulse{0%,100%{box-shadow:0 0 0 0 rgba(155,28,28,.40);}50%{box-shadow:0 0 0 5px rgba(155,28,28,0);}}
.mrt-star-pop{transform-origin:center;animation:mrt-pop .5s var(--mrt-ease-pop) both;}
@keyframes mrt-pop{0%{transform:scale(.4);opacity:0;}55%{transform:scale(1.25);}100%{transform:scale(1);opacity:1;}}
@media (prefers-reduced-motion:reduce){.mrt-press,.mrt-live-dot,.mrt-star-pop{animation:none!important;transition:none!important;}}
</style>
</head>

h+='<div onclick="window._calSelectDay(\''+ds+'\')" style="min-height:52px;background:'+bg+';border:'+bdr+';border-radius:8px;padding:3px;text-align:center;overflow:hidden;cursor:'+cursor+'">';
h+='<div style="font-size:12px;font-weight:700;color:'+col+'">'+d+'</div>';
for(var t=0;t<Math.min(tours.length,2);t++){
var chipBg=isSelected?"rgba(255,255,255,.25)":esc(tours[t].color);
h+='<div style="background:'+chipBg+';color:#fff;border-radius:3px;padding:1px 3px;font-size:7px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(tours[t].emoji)+' '+esc(tours[t].name)+'</div>';
}
if(tours.length>2)h+='<div style="font-size:7px;color:'+(isSelected?"rgba(255,255,255,.7)":"#6B7280")+'">+'+(tours.length-2)+' more</div>';
h+='</div>';
}
h+='</div>';
// Legend
h+='<div style="display:flex;gap:12px;margin-top:10px;padding:0 2px">';
h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6B7280"><div style="width:10px;height:10px;border-radius:2px;background:#F0FDF4;border:2px solid #059669"></div>Upcoming</div>';
h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6B7280"><div style="width:10px;height:10px;border-radius:2px;background:#FFF7ED;border:2px solid #FCD34D"></div>Past</div>';
h+='</div>';
// Selected day tour list
if(selectedDate){
var selTours=window._getMRTTours?window._getMRTTours(selectedDate):[];
var selLabel=new Date(selectedDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
h+='<div style="margin-top:14px;border-top:1px solid #F3F4F6;padding-top:14px">';
h+='<div style="font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'+selLabel+'</div>';
if(selTours.length===0){
h+='<div style="text-align:center;padding:16px;color:#9CA3AF;font-size:13px">No tours on this day</div>';
}else{
selTours.forEach(function(t){
var isPastTour=selectedDate<todayStr;
var badge=isPastTour?'<span style="background:#FEF3C7;color:#92400E;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">PAST</span>':'<span style="background:#D1FAE5;color:#065F46;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">UPCOMING</span>';
h+='<button onclick="window._openMRTTour(\''+jsId(t.id)+'\')" style="width:100%;background:#fff;border:2px solid '+esc(t.color)+';border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;margin-bottom:8px;display:flex;align-items:center;gap:12px">';
h+='<div style="font-size:28px">'+esc(t.emoji)+'</div>';
h+='<div style="flex:1">';
h+='<div style="font-family:Georgia,serif;font-size:15px;font-weight:700;color:'+esc(t.color)+'">'+esc(t.name)+badge+'</div>';
h+='<div style="font-size:12px;color:#6B7280;margin-top:2px">🕒 '+esc(t.time)+' · 🏠 '+(t.listings?t.listings.length:0)+' stops</div>';
h+='</div>';
h+='<div style="font-size:18px;color:'+esc(t.color)+'">→</div>';
h+='</button>';
});
}
h+='</div>';
}
h+='</div>';
box.innerHTML=h;
}
window._calSelectDay=function(ds){
selectedDate=(selectedDate===ds)?null:ds;
render();
};
window._calPrev=function(){cm.month--;if(cm.month<0){cm.month=11;cm.year--;}render();};
window._calNext=function(){cm.month++;if(cm.month>11){cm.month=0;cm.year++;}render();};
render();
ov.appendChild(box);
document.body.appendChild(ov);
};
window._initScrollIndicator=function(){
var ind=document.getElementById("scroll-ind");
if(ind)ind.remove();
ind=document.createElement("div");
ind.id="scroll-ind";
ind.style.cssText="position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1B3A6B,#2A5298);color:#fff;padding:7px 20px 6px;border-radius:16px;font-size:13px;font-weight:600;letter-spacing:.2px;cursor:pointer;z-index:199;box-shadow:0 4px 16px rgba(27,58,107,.4);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Fraunces',Georgia,serif";
ind.innerHTML='<span>More Tours</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;opacity:.9"><path d="m6 9 6 6 6-6"/></svg>';
ind.onclick=function(){window.scrollBy({top:300,behavior:"smooth"})};
document.body.appendChild(ind);
var check=function(){
var sh=document.documentElement.scrollHeight;
var st=window.pageYOffset||document.documentElement.scrollTop;
var ch=window.innerHeight;
var onDash=(location.hash===""||location.hash==="#/"||location.hash==="#");
if(onDash&&sh>ch+100&&st<sh-ch-80){
ind.style.opacity="1";ind.style.pointerEvents="auto";
}else{
ind.style.opacity="0";ind.style.pointerEvents="none";
}
};
window.addEventListener("scroll",check);
window.addEventListener("hashchange",function(){setTimeout(check,60)});
setTimeout(check,500);
setTimeout(check,1500);
var obs=new MutationObserver(function(){setTimeout(check,200)});
obs.observe(document.body,{childList:true,subtree:true});
};
setTimeout(window._initScrollIndicator,800);

</script>
</body>
</html>
