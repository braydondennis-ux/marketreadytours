<!-- Google Maps loads lazily — only injected when address search is first used -->
<script>
window._mapsLoaded=false;
window._mapsCallbacks=[];
window._mapsErrorCallbacks=[];
window._mapsAuthFailed=false;
// Google calls this global if the Maps key is invalid/unauthorized for this domain
// (e.g. RefererNotAllowedMapError). Route it to our own placeholder instead of Google's overlay.
window.gm_authFailure=function(){
  window._mapsAuthFailed=true;
  window._mapsErrorCallbacks.forEach(function(fn){try{fn();}catch(e){}});
};
window.onMapsError=function(cb){
  if(window._mapsAuthFailed){if(cb)cb();return;}
  if(cb)window._mapsErrorCallbacks.push(cb);
};
window.loadGoogleMaps=function(cb){
  if(window.google&&window.google.maps){if(cb)cb();return;}
  if(cb)window._mapsCallbacks.push(cb);
  if(window._mapsLoading)return;
  window._mapsLoading=true;
  window._gmapsReady=function(){
    window._mapsLoaded=true;
    window._mapsCallbacks.forEach(function(fn){try{fn();}catch(e){}});
    window._mapsCallbacks=[];
  };
  var s=document.createElement('script');
  // Braydon's PROD key is restricted by HTTP referrer to marketreadytours.com, so it fails
  // on the *.vercel.app demo — grey "Map preview unavailable" plus a silently dead Places
  // autocomplete. The demo therefore uses its own key from our own GCP project.
  //   1. Paste the demo key into MRT_DEMO_MAPS_KEY below.
  //   2. In Google Cloud Console restrict that key to Websites: https://*.vercel.app/*
  //      and to the Maps JavaScript API + Places API only.
  // Leaving MRT_DEMO_MAPS_KEY empty falls back to the prod key, i.e. today's behaviour.
  // Production is unaffected either way — it never reads the demo key.
  var MRT_PROD_MAPS_KEY='AIzaSyBoPhoNQ5C84nS79QDV36R93APg4Pizo_E';
  var MRT_DEMO_MAPS_KEY='AIzaSyBrD8tfQ17BNVbzll6H78wzxbKbU9Tj2OU';
  var MRT_MAPS_KEY=(location.hostname.endsWith('.vercel.app')&&MRT_DEMO_MAPS_KEY)?MRT_DEMO_MAPS_KEY:MRT_PROD_MAPS_KEY;
  s.src='https://maps.googleapis.com/maps/api/js?key='+MRT_MAPS_KEY+'&libraries=places&loading=async&callback=_gmapsReady';
  s.async=true;s.defer=true;
  document.head.appendChild(s);
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F6F2;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color:#111318;line-height:1.5}
button,select{font-family:'DM Sans',-apple-system,sans-serif}
/* DM Sans display headings (set via inline fontFamily) get tighter optical spacing.
   Brand: the system lives in the contrast between light and bold weight, not in volume. */
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.12}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(47,68,160,.38);border-radius:3px}::-webkit-scrollbar-track{background:transparent}
textarea,input,select{font-family:inherit}
.btn-hover{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease,opacity .18s ease,background .18s ease!important}
.btn-hover:hover{transform:translateY(-1.5px);box-shadow:0 6px 18px rgba(47,68,160,.18)!important;opacity:.97}
.btn-hover:active{transform:translateY(0) scale(.99);box-shadow:none!important}
.card-hover{transition:all .25s cubic-bezier(.4,0,.2,1)}
.card-hover:hover{box-shadow:0 16px 40px -18px rgba(16,26,54,.30)!important;transform:translateY(-3px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeIn .35s cubic-bezier(.4,0,.2,1)}
/* Subtle staggered entrance for tour cards on first load (fill:both so the stagger delay stays hidden) */
.mrt-fade-stagger{animation:fadeIn .5s cubic-bezier(.2,.7,.3,1) both}
/* Cobalt focus ring — 3px halo clears WCAG 2.2 focus-appearance on both canvas and card */
input:focus,textarea:focus,select:focus{outline:none;border-color:#2F44A0!important;box-shadow:0 0 0 3px rgba(47,68,160,.22)!important}
/* Keyboard-only focus for every other interactive element (was previously unstyled) */
a:focus-visible,button:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible{outline:2px solid #2F44A0;outline-offset:2px;border-radius:4px}
/* iOS safe-area: pads the page bottom away from the home indicator */
@supports(padding:env(safe-area-inset-bottom)){body{padding-bottom:env(safe-area-inset-bottom)}.mrt-scroll-pad{padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}}
/* Sync status pill: bottom-left so it never collides with the top-right header logo. Hide the
   steady-state badge on mobile so it cannot cover cards or sticky actions. */
.mrt-syncpill{ top:auto !important; right:auto !important; left:8px !important; bottom:calc(72px + env(safe-area-inset-bottom,0px)) !important; }
@media (max-width:1023px){.mrt-syncpill[data-idle="true"]{display:none!important}}
body.mrt-rating-active .mrt-tabbar{display:none!important}
body.mrt-rating-active .mrt-syncpill[data-idle="true"]{display:none!important}
/* Public masthead horizontal nav links: desktop-only — on mobile the bottom tab bar is the nav (avoids duplicate desktop top nav) */
.mrt-masthead-links{ display:none; }
/* Persistent global top nav bar is desktop-only; hidden on mobile (mobile keeps its per-page headers + bottom tab bar) */
.mrt-topnav{ display:none; }
/* Desktop-only Login in the dashboard action row (mobile keeps Login next to the logo) */
.mrt-dash-login-action{ display:none !important; }
/* Desktop-only #1 tagline in the dashboard action row (mobile keeps it on its own line) */
.mrt-dash-tagline-action{ display:none; }
/* Mobile: keep the logo ONLY on the dashboard/home header; drop it from internal page headers (tour detail,
   rankings, summary, team, requests) so it stops jumping in size/position when you open a tour. */
@media (max-width:1023px){
  .mrt-appbar .mrt-hdr-logo{ display:none !important; }
  .mrt-td-logowrap{ display:none !important; }
  .mrt-route-logo{ display:none !important; }
  .mrt-dash-logorow .mrt-hdr-logo{ display:inline !important; }
}
/* ══ DESKTOP LAYER (>=1024px AND body.mrt-desktop only) ═══════════════════
   Everything here is double-gated: it cannot affect phones, portrait tablets,
   or the Capacitor iOS app (all < 1024px), and DESKTOP_MODE=false removes the
   body class so none of it applies at any width. ════════════════════════ */
/* Layout-transparent list wrapper: invisible to layout at base width (cards
   stay direct children of their original parent → mobile is identical). */
.mrt-list{display:contents}
@media (min-width:1024px){
  /* Shell: lifts the app-wide 480 cap so screens can use desktop width. */
  body.mrt-desktop .mrt-shell{ max-width:none !important; }  /* full-width shell; content is constrained per-block by the *-col classes (1200); headers span edge-to-edge */
  body.mrt-desktop .mrt-col{
    max-width:720px !important;      /* widen the phone column on desktop */
    margin-left:auto !important; margin-right:auto !important;
  }
  /* generic grid behavior for any reflowed list; per-screen tasks tune columns */
  body.mrt-desktop .mrt-list{
    display:grid !important;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px !important;
    align-items:start;
  }
  /* Unified desktop content width: EVERY app page caps at the same 1200px, centered — one consistent
     content well / left+right edge across pages. Grid floors are tuned so each page keeps the column
     count it had before (only the frame widened), not so the layout reflows. */
  body.mrt-desktop .mrt-dash-col{ max-width:1200px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-tours{ grid-template-columns:repeat(auto-fill,minmax(340px,1fr)) !important; gap:22px !important; }
  /* Tour Detail: this col is the whole page container (header + content). Make it full-width so the header
     bleeds, then re-constrain every non-header child to the shared 1200 well. */
  body.mrt-desktop .mrt-detail-col{ max-width:none !important; }
  body.mrt-desktop .mrt-detail-col > :not(.mrt-appbar){ max-width:1200px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-listings{ grid-template-columns:repeat(auto-fill,minmax(520px,1fr)) !important; gap:20px !important; }
  body.mrt-desktop .mrt-summary-col{ max-width:1200px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-summary{ grid-template-columns:repeat(auto-fill,minmax(520px,1fr)) !important; gap:18px !important; }
  body.mrt-desktop .mrt-admin-col{ max-width:1200px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-sponsors,
  body.mrt-desktop .mrt-list-requests{ grid-template-columns:repeat(auto-fill,minmax(520px,1fr)) !important; gap:18px !important; }
  body.mrt-desktop .mrt-list-team{ grid-template-columns:repeat(auto-fill,minmax(340px,1fr)) !important; gap:18px !important; }
  body.mrt-desktop .mrt-list-sponsors{ grid-column:1 / -1 !important; }
  /* Dashboard tour cards: stack thumbnails above a full-width "Open Tour" button (matches mock) */
  body.mrt-desktop .mrt-tourcard-foot{ flex-direction:column !important; align-items:stretch !important; }
  body.mrt-desktop .mrt-tourcard-thumbs{ flex-wrap:wrap !important; }
  body.mrt-desktop .mrt-tourcard-open{ width:100% !important; padding:13px 0 !important; font-size:15px !important; }
  /* refine pass: chrome + desktop-layout fixes */
  body.mrt-desktop .mrt-tabbar{ display:none !important; }        /* bottom tab bar is mobile-only */
  /* Full-bleed page headers: background spans edge-to-edge, inner content stays in the 1200 well
     (every header uses 18px horizontal padding, so content position is unchanged — only the bar widens). */
  body.mrt-desktop .mrt-appbar{ width:100% !important; margin-left:0 !important; margin-right:0 !important; max-width:none !important;
    /* scrollbar-immune (no vw, no overflow-clip so sticky still works): background fills the full-width shell; padding recenters inner content to the 1200 well + 18px */
    padding-left:max(18px, calc(50% - 582px)) !important; padding-right:max(18px, calc(50% - 582px)) !important; }
  body.mrt-desktop .mrt-masthead-links{ display:flex !important; }/* horizontal masthead nav is desktop-only */
  body.mrt-desktop .mrt-masthead-row{ display:none !important; }/* global top nav already carries logo+links+Login on desktop — avoid double header */
  /* Logo now lives in the persistent global top nav bar → hide the per-header logos on desktop */
  body.mrt-desktop .mrt-appbar .mrt-hdr-logo{ display:none !important; }
  body.mrt-desktop .mrt-td-logowrap{ display:none !important; }
  /* Tour Route header carries its own logo outside .mrt-appbar — without this it doubles up
     with the global top-nav logo on desktop. */
  body.mrt-desktop .mrt-route-logo{ display:none !important; }
  /* Persistent global top nav bar — full-width, sticky, logo-only; identical on every page. Desktop only. */
  body.mrt-desktop .mrt-topnav{ position:sticky; top:0; z-index:300; display:flex; align-items:center; height:64px; width:100%; background:var(--mrt-paper); border-bottom:1px solid var(--mrt-hair); padding-left:max(18px, calc(50% - 582px)); padding-right:max(18px, calc(50% - 582px)); }
  body.mrt-desktop .mrt-topnav-logo{ height:48px !important; width:auto !important; }
  body.mrt-desktop .mrt-topnav-links{ margin-left:auto; display:flex; align-items:center; gap:2px; }
  body.mrt-desktop .mrt-topnav-link{ background:none; border:none; cursor:pointer; font:600 13.5px/1 var(--mrt-font-body); color:var(--mrt-muted); padding:9px 13px; border-radius:8px; white-space:nowrap; transition:color .15s ease, background .15s ease; }
  body.mrt-desktop .mrt-topnav-link:hover{ color:var(--mrt-ink); background:var(--mrt-cream); }
  body.mrt-desktop .mrt-topnav-link.is-active{ color:var(--mrt-navy); font-weight:700; }
  /* Dashboard: the logo row is empty on desktop (logo is in the nav bar); hide it so the tagline sits at the top. Mobile keeps the logo here. */
  body.mrt-desktop .mrt-dash-logorow{ display:none !important; }
  body.mrt-desktop .mrt-dash-login-action{ display:flex !important; }  /* desktop Login joins the Calendar/Request/FAQ action row */
  /* Guest dashboard header: everything in .mrt-dash-hdr-top is hidden on desktop, so drop its
     leftover padding and balance the action row so the buttons center vertically in the bar
     (bar has 9px top / 0 bottom padding + 4px button margins → 4px top + 13px bottom evens it out).
     Admin keeps the wrapper (it holds the quick-action grid) and its original spacing. */
  body.mrt-desktop .mrt-dash-hdr-top:not(:has(.mrt-dash-adminrow)){ display:none !important; }
  body.mrt-desktop .mrt-dash-actionrow:has(.mrt-dash-login-action){ padding:4px 0 13px !important; align-items:center; }
  body.mrt-desktop .mrt-dash-tagline-action{ display:none !important; }  /* #1 tagline now lives in the top nav bar next to the logo, so hide the dashboard copies on desktop */
  body.mrt-desktop .mrt-dash-tagline-row{ display:none !important; }     /* (both dashboard tagline lines hidden on desktop; mobile keeps the standalone one) */
  /* The nav bar is the sole stationary element; page headers scroll with content (avoids a sticky-offset gap in tour detail's overflow:hidden container) */
  body.mrt-desktop .mrt-appbar{ position:static !important; }
  body.mrt-desktop .mrt-syncpill{ bottom:10px !important; }        /* tab bar gone on desktop → drop pill to corner */
  body.mrt-desktop .mrt-seg--capped{ max-width:1200px !important; margin-left:auto !important; margin-right:auto !important; }
  body.mrt-desktop .mrt-list-tours{ align-items:stretch !important; }
  body.mrt-desktop .mrt-list-tours > .mrt-card{ display:flex !important; flex-direction:column !important; }
  body.mrt-desktop .mrt-tourcard-foot{ margin-top:auto !important; }
}
/* Mobile: compact "Open" label (icon carries the rest); desktop restores "Open Tour" */
.mrt-tourcard-open .mrt-open-full{ display:none; }
.mrt-tourcard-open .mrt-open-short{ display:inline; }
@media (min-width:1024px){
  body.mrt-desktop .mrt-tourcard-open .mrt-open-full{ display:inline; }
  body.mrt-desktop .mrt-tourcard-open .mrt-open-short{ display:none; }
}
/* ══ DESIGN TOKENS — Market Ready Brand Standards v5, light rendition ═════════
   Source: MRC_BrandStandards_v5_Light.pdf. The palette is taken from the board's
   own light-mode presentation: a warm off-white canvas, white cards, and Ink held
   back for the ONE feature surface per view.

     Ink     #101A36  the deep blue soul — feature surfaces
     Cobalt  #2F44A0  structure and authority, used sparingly
     Steel   #AEBFD6  the accent — one quiet highlight per view

   Variable NAMES are inherited from the previous "Quiet Luxury" system and kept
   verbatim so the ~530 existing references keep resolving; only values moved.
   So --mrt-gold* no longer carries gold — it is now the steel/cobalt accent ramp.
   Gold (#C9A55A) is not part of v5 and appears nowhere in the brand document. ══ */
:root{
  --mrt-ink:#111318;--mrt-ink-2:#101A36;--mrt-navy:#2F44A0;--mrt-navy-2:#101A36;
  /* accent ramp (formerly gold): steel for fills, cobalt where the token lands on text */
  --mrt-gold:#AEBFD6;--mrt-gold-deep:#2F44A0;--mrt-gold-light:#D7E0EE;
  --mrt-cream:#F7F6F2;--mrt-paper:#FFFFFF;--mrt-muted:#5B5F6B;--mrt-muted-2:#8A8D97;
  --mrt-hair:#E8E7E0;--mrt-hair-2:#E4E2DB;--mrt-red:#9B1C1C;
  --mrt-chip-navy-bg:#ECEFF5;--mrt-chip-navy-border:#C7CEE0;
  --mrt-success:#1F7A4D;--mrt-success-bg:#E6F2EA;--mrt-success-border:#BFE0CD;
  --mrt-gold-chip-bg:#EEF1F7;--mrt-neutral-chip-bg:#EDECE6;
  /* explicit brand aliases — prefer these in new code */
  --mrt-cobalt:#2F44A0;--mrt-steel:#AEBFD6;--mrt-surface-ink:#101A36;
  --mrt-on-ink:#ECEFF5;--mrt-on-ink-muted:#C7CEE0;--mrt-hair-ink:rgba(174,191,214,.22);
  /* tour identity hues — cooled into the brand register, still six distinguishable marks */
  --tour-navy:#2F44A0;--tour-pine:#2F5D51;--tour-clay:#6E3F55;--tour-plum:#5B4272;--tour-teal:#2A5A66;--tour-ochre:#4C5566;
  --mrt-font-display:"DM Sans",system-ui,sans-serif;--mrt-font-body:"DM Sans",system-ui,sans-serif;
  --mrt-radius-card:16px;--mrt-radius-modal:18px;--mrt-radius-btn:12px;--mrt-radius-btn-sm:10px;
  --mrt-radius-chip:8px;--mrt-radius-field:12px;--mrt-radius-pill:999px;
  /* NO NOISE: structure comes from hairlines, not from heavy shadow */
  --mrt-shadow-soft:0 1px 2px rgba(16,26,54,.04),0 12px 28px -20px rgba(16,26,54,.16);
  --mrt-shadow-pop:0 16px 34px -20px rgba(16,26,54,.28);
  --mrt-shadow-gold:0 10px 30px -16px rgba(47,68,160,.34);
  --mrt-ease:cubic-bezier(.2,.7,.3,1);--mrt-ease-pop:cubic-bezier(.2,.8,.3,1.4);--mrt-dur-press:.14s;
}
.mrt-eyebrow{font:600 11px/1 var(--mrt-font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--mrt-cobalt);}
/* Section header, straight off the brand board: muted letterspaced label + hairline
   running to the right edge. Use on <div class="mrt-section"><span>LABEL</span></div>. */
.mrt-section{display:flex;align-items:center;gap:16px;margin:0 0 18px;}
.mrt-section>span{font:500 11px/1 var(--mrt-font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--mrt-muted-2);white-space:nowrap;}
.mrt-section::after{content:"";flex:1;height:1px;background:var(--mrt-hair);}
/* ACCENT ONCE: the single steel/cobalt dot. One per view — a dot, a number, a line. */
.mrt-dot{width:5px;height:5px;border-radius:50%;background:var(--mrt-cobalt);display:inline-block;flex-shrink:0;}
.mrt-dot--steel{background:var(--mrt-steel);}
/* Bottom tab bar: the buttons carry inline styles, so the minimum touch target is
   set here (inline styles never set min-height, so nothing is overridden).
   44px is the Apple HIG / WCAG 2.5.5 target; the bar itself stays the Ink surface. */
.mrt-tabbar button{min-height:44px;justify-content:center;}
.mrt-card{background:var(--mrt-paper);border:1px solid var(--mrt-hair);border-radius:var(--mrt-radius-card);}
/* The one dark feature surface per view (pricing/summary/hero panels). */
.mrt-card--ink{background:var(--mrt-surface-ink);border-color:transparent;color:var(--mrt-on-ink);}
.mrt-card--ink .mrt-eyebrow{color:var(--mrt-steel);}
.mrt-card--soft{box-shadow:var(--mrt-shadow-soft);}
.mrt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--mrt-font-body);border-radius:var(--mrt-radius-btn);padding:14px 20px;border:1px solid transparent;cursor:pointer;}
.mrt-btn--sm{padding:10px 14px;font-size:13px;border-radius:var(--mrt-radius-btn-sm);}
.mrt-btn--navy{background:var(--mrt-navy);color:#fff;}
.mrt-btn--ink{background:var(--mrt-surface-ink);color:#fff;}
.mrt-btn--ghost{background:transparent;color:var(--mrt-ink);border-color:var(--mrt-hair-2);}
/* accent button — steel fill, ink label (13.4:1). Was the gold CTA. */
.mrt-btn--gold{background:var(--mrt-gold);color:var(--mrt-ink-2);}
.mrt-pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mrt-font-body);padding:7px 10px;border-radius:var(--mrt-radius-pill);background:#fff;border:1px solid var(--mrt-hair);color:var(--mrt-ink);}
.mrt-chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mrt-font-body);color:var(--mrt-muted);padding:6px 9px;background:var(--mrt-cream);border:1px solid var(--mrt-hair);border-radius:var(--mrt-radius-chip);}
.mrt-field{border:1px solid var(--mrt-hair-2);border-radius:var(--mrt-radius-field);padding:12px 14px;font:500 14px/1.2 var(--mrt-font-body);color:var(--mrt-ink);background:var(--mrt-paper);width:100%;}
.mrt-field:focus{outline:none;border-color:var(--mrt-cobalt);box-shadow:0 0 0 3px rgba(47,68,160,.22);}
/* Segmented control (Team/Requests admin toggles) */
.mrt-seg{display:inline-flex;background:var(--mrt-neutral-chip-bg);border-radius:999px;padding:3px;gap:2px;}
.mrt-seg--block{display:flex;width:100%;}
.mrt-seg__btn{border:none;background:transparent;border-radius:999px;padding:9px 14px;font:700 12px/1 var(--mrt-font-body);color:var(--mrt-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .16s ease,color .16s ease;flex:1;white-space:nowrap;}
.mrt-seg__btn--active{background:var(--mrt-cobalt);color:#fff;box-shadow:0 2px 8px -2px rgba(16,26,54,.30);}
.mrt-seg__count{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.28);color:#fff;}
.mrt-seg__btn:not(.mrt-seg__btn--active) .mrt-seg__count{background:#fff;color:var(--mrt-muted);}
.mrt-seg--sm .mrt-seg__btn{padding:7px 10px;font-size:11px;}
/* Summary screen: 10 category bars in two columns on wider viewports, one on mobile */
.mrt-cat-grid{display:grid;grid-template-columns:1fr;gap:10px 24px;}
@media(min-width:480px){.mrt-cat-grid{grid-template-columns:1fr 1fr;}}
.tour-navy{--tc:var(--tour-navy);}.tour-pine{--tc:var(--tour-pine);}.tour-clay{--tc:var(--tour-clay);}
.tour-plum{--tc:var(--tour-plum);}.tour-teal{--tc:var(--tour-teal);}.tour-ochre{--tc:var(--tour-ochre);}
.tour-dot{width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block;}
.tour-spine{background:var(--tc);}
.mrt-press{transition:transform var(--mrt-dur-press) var(--mrt-ease),box-shadow var(--mrt-dur-press) ease;}
.mrt-press:hover{transform:translateY(-3px);box-shadow:var(--mrt-shadow-pop);}
.mrt-press:active{transform:translateY(-1px) scale(.99);box-shadow:0 8px 18px -12px rgba(16,26,54,.34);}
.mrt-live-dot{animation:mrt-live-pulse 1.8s ease-out infinite;}
@keyframes mrt-live-pulse{0%,100%{box-shadow:0 0 0 0 rgba(155,28,28,.40);}50%{box-shadow:0 0 0 5px rgba(155,28,28,0);}}
.mrt-star-pop{transform-origin:center;animation:mrt-pop .5s var(--mrt-ease-pop) both;}
@keyframes mrt-pop{0%{transform:scale(.4);opacity:0;}55%{transform:scale(1.25);}100%{transform:scale(1);opacity:1;}}
@media (prefers-reduced-motion:reduce){.mrt-press,.mrt-live-dot,.mrt-star-pop,.mrt-fade-stagger{animation:none!important;transition:none!important;}}
</style>
</head>

h+='<button aria-label="Next month" onclick="window._calNext()" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:18px;font-weight:700;color:#fff">›</button>';
h+='<button aria-label="Close calendar" onclick="document.getElementById(\'cal-modal\').remove()" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px;font-weight:700;color:#fff">✕</button>';
h+='</div></div>';
h+='<div style="padding:14px">';
h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
["S","M","T","W","T","F","S"].forEach(function(d){h+='<div style="text-align:center;font-size:11px;font-weight:700;color:#5B5F6B;padding:4px 0">'+d+'</div>';});
h+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
for(var i=0;i<fd;i++)h+='<div style="min-height:52px"></div>';
for(var d=1;d<=dm;d++){
var ds=cm.year+"-"+String(cm.month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
var tours=window._getMRTTours?window._getMRTTours(ds):[];
var isToday=(ds===todayStr);
var isPast=ds<todayStr;
var isSelected=(ds===selectedDate);
var hasTours=tours.length>0;
var bg=isSelected?"#2F44A0":isToday?"#EFF6FF":hasTours&&isPast?"#EDECE6":hasTours?"#F0FDF4":"#fff";
var bdr=isSelected?"2px solid #2F44A0":isToday?"2px solid #2F44A0":hasTours?"2px solid "+(isPast?"#8A8D97":"#059669"):"1px solid #EDECE6";
var col=isSelected?"#fff":isToday?"#2F44A0":isPast&&hasTours?"#92400E":"#0F172A";
var cursor="pointer";
var dayLabel=new Date(ds+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+(hasTours?", "+tours.length+" tour"+(tours.length===1?"":"s"): ", no tours");
h+='<button type="button" aria-label="'+esc(dayLabel)+'" onclick="window._calSelectDay(\''+ds+'\')" style="font:inherit;min-height:52px;width:100%;background:'+bg+';border:'+bdr+';border-radius:8px;padding:3px;text-align:center;overflow:hidden;cursor:'+cursor+'">';
h+='<div style="font-size:12px;font-weight:700;color:'+col+'">'+d+'</div>';
for(var t=0;t<Math.min(tours.length,2);t++){
var chipBg=isSelected?"rgba(255,255,255,.25)":esc(tours[t].color);
h+='<div style="background:'+chipBg+';color:#fff;border-radius:3px;padding:1px 3px;font-size:7px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(tours[t].emoji)+' '+esc(tours[t].name)+'</div>';
}
if(tours.length>2)h+='<div style="font-size:7px;color:'+(isSelected?"rgba(255,255,255,.7)":"#5B5F6B")+'">+'+(tours.length-2)+' more</div>';
h+='</button>';
}
h+='</div>';
// Legend
h+='<div style="display:flex;gap:12px;margin-top:10px;padding:0 2px">';
h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#5B5F6B"><div style="width:10px;height:10px;border-radius:2px;background:#F0FDF4;border:2px solid #059669"></div>Upcoming</div>';
h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#5B5F6B"><div style="width:10px;height:10px;border-radius:2px;background:#EDECE6;border:2px solid #8A8D97"></div>Past</div>';
h+='</div>';
// Selected day tour list
if(selectedDate){
var selTours=window._getMRTTours?window._getMRTTours(selectedDate):[];
var selLabel=new Date(selectedDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
h+='<div style="margin-top:14px;border-top:1px solid #EDECE6;padding-top:14px">';
h+='<div style="font-size:12px;font-weight:700;color:#5B5F6B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'+selLabel+'</div>';
if(selTours.length===0){
h+='<div style="text-align:center;padding:16px;color:#8A8D97;font-size:13px">No tours on this day</div>';
}else{
selTours.forEach(function(t){
var isPastTour=selectedDate<todayStr;
var badge=isPastTour?'<span style="background:#F1F0EB;color:#5B5F6B;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">PAST</span>':'<span style="background:#EFF1FA;color:#2F44A0;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">UPCOMING</span>';
h+='<button onclick="window._openMRTTour(\''+jsId(t.id)+'\')" style="width:100%;background:#fff;border:2px solid '+esc(t.color)+';border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;margin-bottom:8px;display:flex;align-items:center;gap:12px">';
h+='<div style="font-size:28px">'+esc(t.emoji)+'</div>';
h+='<div style="flex:1">';
h+='<div style="font-family:DM Sans,system-ui,sans-serif;font-size:15px;font-weight:700;color:'+esc(t.color)+'">'+esc(t.name)+badge+'</div>';
h+='<div style="font-size:12px;color:#5B5F6B;margin-top:2px">'+esc(t.time)+' · '+(t.listings?t.listings.length:0)+((t.listings&&t.listings.length===1)?' stop':' stops')+'</div>';
h+='</div>';
h+='<div style="font-size:18px;color:'+esc(t.color)+'">→</div>';
h+='</button>';
});
}
h+='</div>';
}
h+='</div>';
box.innerHTML=h;
}
window._calSelectDay=function(ds){
selectedDate=(selectedDate===ds)?null:ds;
render();
};
window._calPrev=function(){cm.month--;if(cm.month<0){cm.month=11;cm.year--;}render();};
window._calNext=function(){cm.month++;if(cm.month>11){cm.month=0;cm.year++;}render();};
render();
ov.appendChild(box);
document.body.appendChild(ov);
ov.focus();
};
window._initScrollIndicator=function(){
var ind=document.getElementById("scroll-ind");
if(ind)ind.remove();
ind=document.createElement("div");
ind.id="scroll-ind";
ind.style.cssText="position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2F44A0,#101A36);color:#fff;padding:7px 20px 6px;border-radius:16px;font-size:13px;font-weight:600;letter-spacing:.2px;cursor:pointer;z-index:199;box-shadow:0 4px 16px rgba(47,68,160,.35);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;opacity:0;transition:opacity .3s;pointer-events:none;font-family:'DM Sans',system-ui,sans-serif";
ind.innerHTML='<span>More Tours</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;opacity:.9"><path d="m6 9 6 6 6-6"/></svg>';
ind.onclick=function(){window.scrollBy({top:300,behavior:"smooth"})};
document.body.appendChild(ind);
var check=function(){
var sh=document.documentElement.scrollHeight;
var st=window.pageYOffset||document.documentElement.scrollTop;
var ch=window.innerHeight;
var onDash=(location.hash===""||location.hash==="#/"||location.hash==="#");
if(onDash&&sh>ch+100&&st<sh-ch-80){
ind.style.opacity="1";ind.style.pointerEvents="auto";
}else{
ind.style.opacity="0";ind.style.pointerEvents="none";
}
};
window.addEventListener("scroll",check);
window.addEventListener("hashchange",function(){setTimeout(check,60)});
setTimeout(check,500);
setTimeout(check,1500);
var obs=new MutationObserver(function(){setTimeout(check,200)});
obs.observe(document.body,{childList:true,subtree:true});
};
setTimeout(window._initScrollIndicator,800);

</script>
</body>
</html>
