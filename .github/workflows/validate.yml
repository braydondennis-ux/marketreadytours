name: Validate MarketReady Tours

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web tooling
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Unit tests
        run: npm test

      - name: Build and validate
        run: npm run validate

      - name: Security Rules tests
        run: npm run test:rules

      - name: Emulator workflow tests
        run: npm run test:workflow

      - name: Confirm generated bundle is reproducible
        run: git diff --exit-code -- www
