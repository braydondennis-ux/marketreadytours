name: Validate MarketReady Tours

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firebase emulators are a Java process, and firebase-tools requires JDK 21+.
      # The runner's default JDK is older, which is why "Security Rules tests" and
      # "Emulator workflow tests" have failed on every commit since at least 2026-07-27.
      - name: Set up Java for the Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web tooling
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Unit tests
        run: npm test

      - name: Build and validate
        run: npm run validate

      - name: Security Rules tests
        run: npm run test:rules

      - name: Emulator workflow tests
        run: npm run test:workflow

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: iPhone and Chrome workflow tests
        run: npm run test:browser

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Confirm generated bundle is reproducible
        run: git diff --exit-code -- www
