name: Deploy to GitHub Pages

# Publishes the built static bundle (www/) to marketreadytours.com.
#
# Pages Source is set to "GitHub Actions", so the repository root is NOT served —
# only the artifact uploaded here. Two consequences worth knowing:
#   1. Internal files (HANDOFF.md, SECURITY_NOTES.md, functions/, scripts/) are never
#      published, because they are not part of www/.
#   2. If this workflow fails, Pages keeps serving the PREVIOUS deployment. A broken
#      build cannot take production down.
#
# scripts/build.mjs substitutes the App Check placeholders in index.html. Without the
# site key the app throws during Firebase init and silently degrades to a dead,
# localStorage-only page — so the build is verified below rather than trusted.
#
# The reCAPTCHA site key is a public client-side value (it ships in the HTML of every
# page that uses reCAPTCHA); it is not a secret and is intentionally inline here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; do not cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MRT_APP_CHECK_SITE_KEY: 6LeP0XUtAAAAAJ8WdZG1lhaoJUXgGINFH1SUlEKT
      MRT_APP_CHECK_PROVIDER: enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static bundle
        run: npm run build

      - name: Verify App Check placeholders were substituted
        run: |
          if grep -q "__MRT_APP_CHECK_SITE_KEY__\|__MRT_APP_CHECK_PROVIDER__" www/index.html; then
            echo "::error::App Check placeholders survived the build — deploying this would"
            echo "::error::break Firebase init and serve a dead site. Refusing to continue."
            exit 1
          fi
          grep -q "$MRT_APP_CHECK_SITE_KEY" www/index.html \
            || { echo "::error::Production App Check site key missing from build."; exit 1; }
          grep -q 'content="enterprise"' www/index.html \
            || { echo "::error::App Check provider is not 'enterprise'."; exit 1; }
          echo "App Check wiring verified."

      - name: Verify the production build is not pointed at dev
        run: |
          grep -q "marketready-tours-dev" www/index.html \
            && echo "note: dev config present (expected — chosen at runtime by hostname)"
          test -f www/index.html && test -f www/manifest.json && test -f www/privacy-policy.html
          echo "Bundle contents verified."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
